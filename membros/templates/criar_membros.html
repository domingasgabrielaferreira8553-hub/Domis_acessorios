<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=!, initial-scale=1.0">
    <title>Editar Membro</title>
    <style> 
        body { font-family: Arial, sans-serif; margin: 20px; } form { max-width: 400px; margin: 20px 0; } label { display: block; margin-top: 10px; font-weight: bold; } 
        input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; } .btn { padding: 10px 20px; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; } .btn-update { background-color: #2196F3; color: white; } .btn-cancel { background-color: #f44336; color: white; } .error { color: red; font-size: 14px; } 
    </style>
     </head> 
        <body> 
            <h1>Editar Membro: {{ membro.firstname }} {{ membro.lastname }}</h1> 
            <form method="POST">
                 {% csrf_token %}
                  11 Django Criando um Sistema de Membros
                  {% for field in form %} 
            <div>
                 {{ field.label_tag }}
                  {{ field }}
                   {% if field.errors %} 
                   <div class="error">
                    {{ field.errors }}
                </div>
                 {% endif %} 
                </div> 
                {% endfor %} <br>
                 <!-- BOTÃO ATUALIZAR -->
                  <button type="submit" class="btn btn-update">Atualizar</button>
                   <!-- BOTÃO CANCELAR --> 
                   <a href="{% url 'listar_membros' %}" class="btn btn-cancel">Canc elar</a> 
            </form> 
        </body> 
         </html>
